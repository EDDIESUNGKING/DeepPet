# DeepPet: one permanently stable GitHub -> Netlify root layout.
# Upload ALL four root entries to GitHub, without nested source/dist folders.
[build]
  command = "echo DeepPet static site ready"
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
