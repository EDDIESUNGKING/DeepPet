[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/assets/expressions/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/demo_score_portraits/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
