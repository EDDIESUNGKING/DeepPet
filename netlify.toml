# Upload these four entries to the root of the GitHub repository.
# Static assets are already built; future version numbers do not change paths.
[build]
  command = "echo DeepPet static site ready"
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
