# Direct, prebuilt static site. The ZIP root is the website root.
# File-based settings override an obsolete Netlify UI build command.
[build]
  command = "echo DeepPet static site ready"
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
